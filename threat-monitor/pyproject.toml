[project]
name = "dozor"
version = "1.0.0"
description = "Мониторинг общедоступного контента: угрозы насилия, вербовка, подстрекательство, травля, опасное вовлечение"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
telegram = ["telethon>=1.36"]
langid = ["fasttext"]
dev = ["pytest>=8"]

[project.scripts]
dozor = "dozor.__main__:main"

[tool.setuptools.packages.find]
include = ["dozor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
